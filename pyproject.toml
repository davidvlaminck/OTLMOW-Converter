[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otlmow_converter"
version = "1.27"
authors = [{name = "David Vlaminck", email = "david.vlaminck@mow.vlaanderen.be"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    'openpyxl >= 3.0',
    'otlmow-model >= 2.19.0.0',
    'rdflib >= 6.0.0',
    'geojson>=3.0.1',
    'prettytable>=3.6.0',
    'lxml>=4.9.3',
    'pandas>=1.3.5,<4.0',
    'pyarrow>=12.0.0',
]

[tool.setuptools.packages.find]
include = ["otlmow_converter*"]

[project.urls]
"Homepage" = "https://github.com/davidvlaminck/OTLMOW-Converter"
"Bug Tracker" = "https://github.com/davidvlaminck/OTLMOW-Converter/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-subtests",
    "pytest-timeout",
    "pytest-asyncio",
    "nbmake"
]
benchmark = [
    "prettytable"
]
dev = ["ruff>=0.9.0"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["otlmow_converter", "UnitTests", "code_quality/scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "C4", "UP", "PYI", "PT", "RUF", "S", "BLE", "TRY", "FLY",
    "A", "C", "PL", "Q", "RET", "N", "W", "T20", "G", "LOG", "PIE", "SIM", "PERF",
    "ARG", "TID", "PTH",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"otlmow_converter/**/*.py" = ["N802", "N803", "N815", "N806", "TID252"]
"UnitTests/**" = ["S101", "N802", "N803", "N815", "PLR2004", "PT006", "PT011"]
"code_quality/scripts/*.py" = ["T201", "S603"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["UnitTests"]

[tool.mypy]
python_version = "3.9"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["otlmow_converter.*"]
disallow_untyped_defs = false