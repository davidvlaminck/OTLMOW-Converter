# Coverage configuration for the quality gate.
# Kept separate from pyproject.toml so the published coverage badge
# (UnitTests/htmlcov, produced by .github/workflows/coverage.yml) is unaffected.
#
# Use it with:
#   COVERAGE_RCFILE=code_quality/coverage.cfg
#   pytest --cov=<package> --cov-report=json:code_quality/reports/coverage.json

[run]
source = otlmow_converter
branch = true
omit =
    */__pycache__/*
    */site-packages/*

[report]
exclude_also =
    if TYPE_CHECKING:
    raise NotImplementedError
    @abstractmethod
    @overload
    if __name__ == .__main__.:
    pragma: no cover
show_missing = true
skip_covered = false
